name: Palomar Green 64 preflight

on:
  push:
    branches: [main]
    paths:
      - 'proofs/green64/**'
      - '.github/workflows/palomar-preflight.yml'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@14aa8d6b3c2f14a8540605e37144560b9a00e7e7
    with:
      repository: ${{ github.repository }}
      commit: ${{ github.sha }}
      pipeline_commit: 14aa8d6b3c2f14a8540605e37144560b9a00e7e7
      request_id: green64proof
      mode: full
      execution_profile: palomar-standard-v1
      options: '{"project_path":"proofs/green64","comparator_config_path":"proofs/green64/comparator.json","formalization_metadata_path":"proofs/green64/formalization.yaml","authorization_relationship":"I am a responsible author or maintainer"}'
