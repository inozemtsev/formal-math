status:
  scope: >-
    The infinitude statement for p - 2 and an unbounded-witness statement
    are the principal claims. Subtraction is in the natural numbers, and
    Omega is Mathlib's cardFactors. The witness statement includes positivity
    of p - 2. Thresholds in the analytic argument are eventual; no explicit
    numerical threshold is asserted. The Challenge's two deliberate proof
    holes are excluded from the proof-development counts below.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: [propext, Classical.choice, Quot.sound]
  known_gaps: >-
    The local source and kernel checks are recorded in VERIFICATION.md.
    SOURCE_EQUIVALENCE.json records the unchanged formal inputs and the
    descriptive metadata changes since those checks. They are not protected
    Palomar verification or editorial review. The third-party permission
    issue documented in THIRD_PARTY.md remains unresolved. The repository
    maintainer was contacted by email on 2026-11-12; a reply and permission
    are pending. The request is not a licence grant or endorsement. The full
    informal proof and article are outside this submitted version.

automation:
  methods:
    - method: agent
      models: [gpt-6 astra]
      framework: Codex
      tool_setup: >-
        AI proof development and Lean formalization, followed by local
        compilation, exact-statement tests and axiom audits.
    - method: agent
      framework: Codex
      tool_setup: >-
        Local packaging, module-system migration and preparation of Markdown
        and TeX exposition from the Lean development and matching Markdown.
  notes: >-
    Proof and formalization credit: gpt-6 astra. Igor Inozemtsev directed the
    work and maintains the project. AI systems are credited here rather than
    listed as human authors. No independent human mathematical review is
    claimed. Exact current validation results belong in VERIFICATION.md.

fidelity:
  divergences: >-
    The main proposition is the fixed-shift question stated as an affirmative
    infinitude theorem. It has no extra hypotheses. The additional witness
    theorem makes unboundedness and positivity explicit. Omega counts
    multiplicities, so p = 11 does not qualify, since Omega(9) = 2.

review:
  status: agent-reviewed
  notes: >-
    Local source compilation, exact-statement checks, axiom audits and
    independent-kernel checks passed for the formal inputs recorded in
    VERIFICATION.md. Separate AI first-reader reports concern the article
    being revised outside this submitted version. No human peer review or
    Palomar endorsement is claimed.

