version: v0.4

project:
  name: "Green's Problem 64: odd prime-factor parity in shifted primes"
  description: >-
    There are infinitely many primes p for which p - 2 has an odd number of
    prime factors, counted with multiplicity. A second theorem gives such
    a prime above every natural bound and explicitly records p - 2 > 0.
    Both statements have no additional hypotheses. The standalone Lean
    development includes its supporting analytic number theory and uses
    Mathlib as its only direct Lake dependency.
  authors: [Igor Inozemtsev]
  responsible_maintainers: [Igor Inozemtsev]
  license: Apache-2.0

classification:
  arxiv: [math.NT]
  msc2020: [11N36, 11N05]

sources:
  - title: "100 Open Problems, Problem 64"
    authors: [Ben Green]
    type: paper
    id: https://people.maths.ox.ac.uk/greenbj/papers/open-problems.pdf#problem.64
    location: "December 2025 revision, page 31, Problem 64"
    relationship: formalizes
    author_endorsement: not-contacted
    note: >-
      The source poses the infinitude question. This development formalizes
      its fixed-shift statement with prime factors counted with multiplicity
      and proves an affirmative answer. The source is not cited as containing
      this proof. Priority and novelty have not been established by a
      comprehensive literature search and are not claimed.
  - title: "Shifted primes with a prescribed parity of the number of prime factors"
    authors: [Jizhou Guo]
    type: paper
    id: https://github.com/aster2024/openai-math-followups/blob/563cece082b628dfe3ba0290c9e4e30b92ffeca6/shifted-prime-parity/source/main.tex
    location: "October 2026; fixed-shift specialization of the affine-prime-form argument"
    relationship: adapts
    author_endorsement: not-contacted
    note: >-
      The agent found this manuscript on GitHub during the final stage of
      formalization and used its exposition to guide the r0 = 20 weight,
      arithmetic side conditions, full-cell proxies and parameter order.
      Guo did not participate in the project or provide personal assistance.
      Earlier work pursued the same fixed-shift strategy from the
      common OpenAI sources. The broader shift, parity, squarefreeness and
      quantitative claims in this paper are not all formalized here. The
      retained source was hash-checked; the original URL returned 404 on
      2026-11-12. See ACKNOWLEDGEMENTS.md for the exact source identity.
  - title: "Prime Predecessors with an Even Number of Prime Factors"
    authors: [OpenAI]
    type: paper
    id: https://github.com/openai/math/blob/adc7f1241b42e322a6451854ab7e4b4c146bf78a/preprints/Prime-Predecessors-with-an-Even-Number-of-Prime-Factors-September-17-2026/build/main.tex
    relationship: adapts
    author_endorsement: not-contacted
    note: >-
      Source of the parity-selecting weight, prime-slot correlation method
      and weighted prime-extraction architecture, adapted to p - 2.
  - title: "Weighted dilation graphs, smooth shifted primes and totient fibers"
    authors: [OpenAI]
    type: paper
    id: https://github.com/openai/math/tree/adc7f1241b42e322a6451854ab7e4b4c146bf78a/preprints/Weighted-Dilation-Graphs-Smooth-Shifted-Primes-and-Totient-Fibers-September-24-2026
    relationship: builds-on
    author_endorsement: not-contacted
    note: >-
      Source of supporting dilation-graph, correlation, sieve and ordinary
      cell-approximation arguments. Required inputs are proved in the
      included Lean development rather than introduced as axioms.

